<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>历史记录</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="p-header">
      <div class="p-brand">
        <img src="icons/icon48.png" width="28" height="28" alt="">
        <div>
          <strong>历史记录</strong>
          <span>EDGE 风格</span>
        </div>
        <span class="p-demo" id="demoPill" hidden>演示</span>
      </div>
      <div class="p-header-actions">
        <button class="p-icon-btn" type="button" id="settingsBtn" data-icon="settings" aria-label="设置" title="设置"></button>
      </div>
    </header>

    <div class="p-search">
      <span class="p-search-icon" data-icon="search"></span>
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜索历史记录" aria-label="搜索历史记录">
      <button class="p-search-clear" type="button" id="searchClear" data-icon="close" aria-label="清除搜索" hidden></button>
      <kbd class="p-search-kbd" id="searchKbd">/</kbd>
    </div>

    <div class="p-scroll" id="scrollArea">
      <div id="mainContent">
        <section class="p-section">
          <div class="p-section-head">
            <h2>最近访问</h2>
            <button class="p-link-btn" type="button" id="viewAll">查看全部<span data-icon="chevron-right"></span></button>
          </div>
          <div class="p-list" id="recentList"></div>
        </section>

        <section class="p-section" id="closedSection">
          <div class="p-section-head">
            <h2>最近关闭</h2>
            <button class="p-link-btn" type="button" id="viewClosed">全部<span data-icon="chevron-right"></span></button>
          </div>
          <div class="p-list" id="closedList"></div>
        </section>
      </div>

      <div id="searchView" hidden>
        <div class="p-section-head p-search-head">
          <h2 id="searchTitle">搜索结果</h2>
          <div class="p-search-head-actions">
            <span class="p-count" id="searchCount"></span>
            <button class="p-link-btn" type="button" id="searchFull">
              完整页面<span data-icon="chevron-right"></span>
            </button>
          </div>
        </div>
        <div class="p-list" id="searchList"></div>
      </div>
    </div>

    <footer class="p-footer">
      <button class="p-full-link" type="button" id="openFull">
        <span data-icon="history"></span>
        <span>打开完整历史记录</span>
        <span class="p-full-arrow" data-icon="chevron-right"></span>
      </button>
      <span class="p-shortcut" id="shortcutHint"><kbd>Alt</kbd><span>+</span><kbd>H</kbd></span>
    </footer>

    <div class="p-toast" id="toast" hidden></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
